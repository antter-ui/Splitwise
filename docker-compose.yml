version: '3.8'

services:
  mongodb:
    image: mongo:7-jammy
    container_name: splitsync_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: splitsync
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: splitsync_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost:3000
      MONGO_URI: mongodb://mongodb:27017/splitsync
      JWT_SECRET: splitsync_super_secret_production_key_change_me
      JWT_EXPIRES_IN: 7d
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: splitsync_client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mongo_data:
